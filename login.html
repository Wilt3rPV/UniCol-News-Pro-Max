<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - UniCol News</title>
  <script src="database.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }

    /* ===== HEADER (matches NEWS.html / index.html) ===== */
    .login-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .login-header img {
      height: 48px;
      width: auto;
      cursor: pointer;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
      transition: transform 0.2s ease;
    }

    .login-header img:hover { transform: scale(1.05); }

    .login-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    /* ===== MAIN ===== */
    .login-main {
      display: grid;
      place-items: center;
      min-height: calc(100vh - 81px);
      padding: 40px 20px;
    }

    /* ===== GLASS CARD ===== */
    .login-card {
      width: min(440px, 100%);
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px) saturate(180%);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 25px 50px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.8);
      padding: 48px 40px;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .login-card > * { position: relative; z-index: 1; }

    .login-card h2 {
      font-size: 28px;
      font-weight: 800;
      color: #1a1a1a;
      margin-bottom: 6px;
      text-align: center;
    }

    .login-card .subtitle {
      color: #888;
      font-size: 15px;
      text-align: center;
      margin-bottom: 36px;
    }

    .form-group { margin-bottom: 20px; }

    .form-label {
      display: block;
      color: #555;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f8f8f8;
      border: 1px solid #e0e0e0;
      color: #333;
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      background: #fff;
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    .form-input::placeholder { color: #bbb; }

    .login-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      margin-top: 8px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      filter: brightness(1.05);
    }

    .login-btn:active {
      transform: translateY(0);
      filter: brightness(0.98);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .form-footer {
      margin-top: 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-footer a {
      color: #667eea;
      font-size: 14px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }

    .form-footer a:hover {
      color: #764ba2;
      text-decoration: underline;
    }

    .form-error {
      color: #ff6b6b;
      font-size: 14px;
      text-align: center;
      margin-top: 12px;
      padding: 10px;
      background: rgba(255, 107, 107, 0.08);
      border-radius: 8px;
      display: none;
    }

    .form-error.visible { display: block; }

    /* ===== TOAST ===== */

    @keyframes spin { to { transform: rotate(360deg); } } */

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .login-header { padding: 12px 20px; }
      .login-header h1 { font-size: 20px; }
      .login-card { padding: 32px 24px; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <div id="toastContainer" class="toast-container">
    <div id="toast" class="toast">
      <div class="toast-spinner"></div>
      <span class="toast-text" id="toastText">Loading...</span>
    </div>
  </div>

  <header class="login-header">
    <img src="unicols.png" alt="UNI-COL News" onclick="window.location.href='index.html'">
    <h1>Admin Login</h1>
  </header>

  <main class="login-main">
    <div class="login-card">
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to manage campus content</p>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="loginEmail" placeholder="admin@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Sign In</button>

        <div class="form-error" id="loginError"></div>
      </form>

      <div class="form-footer">
        <a onclick="window.location.href='accountcreation.html?view=forgot'">Forgot password?</a>
        <a onclick="window.location.href='accountcreation.html?view=register'">Need an admin account?</a>
        <a onclick="goBack()">← Back to campus</a>
      </div>
    </div>
  </main>

  <script>

    function getRedirectUrl() {
      const params = new URLSearchParams(window.location.search);
      const r = params.get('redirect');
      if (r) return decodeURIComponent(r);
      const ref = document.referrer;
      if (ref && ref.includes(window.location.host) && !ref.includes('login.html')) return ref;
      return 'index.html';
    }

    function goBack() {
      window.location.href = getRedirectUrl();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      err.classList.remove('visible');
      btn.disabled = true;

      showToast('Signing in...', 'loading');

      try {
        await signIn(document.getElementById('loginEmail').value,
                     document.getElementById('loginPassword').value);
        showToast('Signed in successfully!', 'success');
        setTimeout(() => window.location.href = getRedirectUrl(), 1000);
      } catch (error) {
        hideToast();
        err.textContent = error.message || 'Invalid credentials';
        err.classList.add('visible');
        btn.disabled = false;
      }
    }

    checkAuth().then(() => {
      if (currentUser && isAdmin) window.location.href = getRedirectUrl();
    });
  </script>
  <script src="news.js"></script>
</body>
</html>
