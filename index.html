<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniCol News</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        min-height: 100vh;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #f5f6fa;
        color: #1a1a1a;
      }

      /* Page fade-in (functions.js adds .loaded) */
      body {
        opacity: 0;
        transform: translateY(-20px);
        transition: opacity 0.4s ease-out, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      }
      body.loaded { opacity: 1; transform: translateY(0); }

      /* =========================
         HEADER
         ========================= */
      .menu-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 18px 20px 64px;
        text-align: center;
        position: relative;
      }

      .menu-logo {
        width: 210px;
        max-width: 60%;
        height: auto;
        display: block;
        margin: 0 auto;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
      }

      .menu-tagline {
        margin-top: 8px;
        color: #fff;
        font-size: 20px;
        font-weight: 500;
      }

      /* =========================
         SEARCH (overlaps header)
         ========================= */
      .search-wrap {
        max-width: 640px;
        margin: -34px auto 0;
        padding: 0 20px;
        position: relative;
        z-index: 2;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #fff;
        border-radius: 14px;
        padding: 0 16px;
        box-shadow: 0 8px 24px rgba(40, 40, 90, 0.18);
        border: 2px solid transparent;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .search-box:focus-within {
        border-color: #667eea;
        box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
      }

      .search-box svg { flex: 0 0 auto; width: 24px; height: 24px; stroke: #888; }

      .search-box input {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        background: transparent;
        font: inherit;
        font-size: 19px;
        padding: 20px 0;
        color: #222;
      }

      .search-clear {
        border: none;
        background: #eee;
        color: #666;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        font-size: 14px;
        cursor: pointer;
        display: none;
      }
      .search-clear.visible { display: block; }
      .search-clear:hover { background: #ddd; }

      /* =========================
         SCHOOL GROUPS
         ========================= */
      .groups {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 24px 56px;
      }

      .school-group { margin-bottom: 34px; }

      .school-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 14px;
        padding-bottom: 8px;
        border-bottom: 2px solid #e8eaf6;
      }

      .school-head h2 { font-size: 25px; font-weight: 800; letter-spacing: -0.01em; }
      .school-head span { font-size: 16px; color: #666; }

      .campus-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 24px;
      }

      /* =========================
         CAMPUS CARD
         ========================= */
      .campus-card {
        display: flex;
        flex-direction: column;
        background: #fff;
        border-radius: 14px;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
        animation: cardIn 0.45s ease backwards;
      }

      @keyframes cardIn {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .campus-card:hover,
      .campus-card:focus-visible {
        transform: translateY(-4px);
        box-shadow: 0 12px 28px rgba(0,0,0,0.14);
        outline: none;
      }
      .campus-card:focus-visible { box-shadow: 0 0 0 3px #667eea, 0 12px 28px rgba(0,0,0,0.14); }
      .campus-card:active { transform: translateY(-1px) scale(0.99); }

      /* Photo with shimmer placeholder while it loads */
      .campus-photo {
        position: relative;
        height: 200px;
        background: linear-gradient(90deg, #f3f3f3 25%, #fafafa 50%, #f3f3f3 75%);
        background-size: 200% 100%;
        animation: shimmer 1.4s ease-in-out infinite;
        overflow: hidden;
      }

      .campus-photo.loaded { animation: none; background: #eee; }

      .campus-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        opacity: 0;
        transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .campus-photo.loaded img { opacity: 1; }
      .campus-card:hover .campus-photo img { transform: scale(1.05); }

      @keyframes shimmer {
        from { background-position: 200% 0; }
        to   { background-position: -200% 0; }
      }

      .campus-info { padding: 18px 20px 16px; flex: 1; }

      .campus-school {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #666;
      }

      .campus-name {
        margin-top: 4px;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.01em;
        line-height: 1.25;
      }

      /* Campus colour strip (uses each campus's own theme colours) */
      .campus-accent { height: 7px; }

      /* =========================
         EMPTY SEARCH RESULT
         ========================= */
      .no-results {
        display: none;
        text-align: center;
        padding: 50px 20px;
        font-size: 17px;
        color: #666;
      }
      .no-results.visible { display: block; }
      .no-results strong { display: block; font-size: 20px; color: #666; margin-bottom: 4px; }

      /* =========================
         RESPONSIVE
         ========================= */
      @media (max-width: 640px) {
        .menu-header { padding: 14px 16px 56px; }
        .menu-logo { width: 150px; }
        .menu-tagline { font-size: 17px; }
        .groups { padding: 22px 16px 40px; }
        .school-group { margin-bottom: 26px; }
        .school-head h2 { font-size: 21px; }

        .campus-grid { grid-template-columns: 1fr; gap: 14px; }

        /* Compact rows: small photo on the left */
        .campus-card { flex-direction: row; align-items: stretch; }
        .campus-photo { flex: 0 0 120px; height: auto; min-height: 100px; }
        .campus-info {
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 14px 16px;
        }
        .campus-name { font-size: 23px; }
        .campus-accent { width: 7px; height: auto; flex: 0 0 7px; }
        .campus-card { flex-wrap: nowrap; }
      }

      @media (prefers-reduced-motion: reduce) {
        body, .campus-card, .campus-photo img { transition: none; animation: none; }
        .campus-photo { animation: none; }
        .campus-card { animation: none; }
      }
    </style>
  </head>
  <body>
    <header class="menu-header">
      <img src="unicols.png" class="menu-logo" alt="UNI-COL News">
      <p class="menu-tagline">Pick your campus to read the news</p>
    </header>

    <div class="search-wrap">
      <label class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input id="campusSearch" type="search" placeholder="Search campus (e.g. PRMSU, Iba, Gordon)" autocomplete="off" aria-label="Search campus">
        <button id="searchClear" class="search-clear" type="button" aria-label="Clear search">&times;</button>
      </label>
    </div>

    <main id="groups" class="groups"></main>

    <div id="noResults" class="no-results">
      <strong>No campus found</strong>
      Try a school name like PRMSU or Columban, or a town like Iba.
    </div>

    <script>
      // ------------------------------------------------------------
      // CAMPUS DATA  (id must match the ?college= values used in NEWS.html / news.js)
      // ------------------------------------------------------------
      const schools = [
        {
          name: "President Ramon Magsaysay State University",
          short: "PRMSU",
          campuses: [
            { id: "prmsuIba",     name: "Iba",         img: "prmsu.png",       c1: "#4b75fd", c2: "#ffd829" },
            { id: "prmsuBotolan", name: "Botolan",     img: "botolans.png",    c1: "#961313", c2: "#942525" },
            { id: "prmsuCaste",   name: "Castillejos", img: "prmsucaste.png",  c1: "#D2B48C", c2: "#D2B48C" },
            { id: "prmsuMan",     name: "Masinloc",    img: "prmsumas.png",    c1: "#797979", c2: "#555555" },
            { id: "prmsuCruz",    name: "Sta. Cruz",   img: "prmsucruz.png",   c1: "#4b75fd", c2: "#ffd829" }
          ]
        },
        {
          name: "Columban College",
          short: "Columban",
          campuses: [
            { id: "ccGapo", name: "Olongapo", img: "colom.png",  c1: "#7797ff", c2: "#f2ff7e" },
            { id: "ccCruz", name: "Sta. Cruz", img: "colom2.png", c1: "#6580d8", c2: "#dcdfc1" }
          ]
        },
        {
          name: "Gordon College",
          short: "Gordon",
          campuses: [
            { id: "gcGapo", name: "Olongapo", img: "gcgapo.png", c1: "#0c530a", c2: "#ddce00" }
          ]
        },
        {
          name: "Micro Asia College of Science and Technology",
          short: "MACSAT",
          campuses: [
            { id: "macsatIba", name: "Iba", img: "scfront2.png", c1: "#169c33", c2: "#57ff48" }
          ]
        },
        {
          name: "Lyceum of Western Luzon",
          short: "Lyceum",
          campuses: [
            { id: "lyceumBotolan", name: "Botolan", img: "lie.png", c1: "#169c33", c2: "#57ff48" }
          ]
        }
      ];

      function esc(str) {
        return String(str).replace(/[&<>"']/g, ch => (
          { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]
        ));
      }

      // ------------------------------------------------------------
      // RENDER
      // ------------------------------------------------------------
      const groupsEl = document.getElementById("groups");
      const searchEl = document.getElementById("campusSearch");
      const clearEl = document.getElementById("searchClear");
      const noResultsEl = document.getElementById("noResults");

      let cardIndex = 0;

      function cardHtml(school, c) {
        const delay = (cardIndex++ * 0.04).toFixed(2);
        return `
          <a class="campus-card" href="NEWS.html?college=${encodeURIComponent(c.id)}"
             data-search="${esc((school.name + " " + school.short + " " + c.name).toLowerCase())}"
             style="animation-delay:${delay}s">
            <div class="campus-photo">
              <img src="${esc(c.img)}" alt="" loading="lazy">
            </div>
            <div class="campus-info">
              <div class="campus-school">${esc(school.short)}</div>
              <div class="campus-name">${esc(c.name)}</div>
            </div>
            <div class="campus-accent" style="background:linear-gradient(90deg, ${c.c1}, ${c.c2})"></div>
          </a>`;
      }

      function render() {
        groupsEl.innerHTML = schools.map(school => `
          <section class="school-group" data-school="${esc(school.short)}">
            <div class="school-head">
              <h2>${esc(school.name)}</h2>
              <span>${school.campuses.length} ${school.campuses.length === 1 ? "campus" : "campuses"}</span>
            </div>
            <div class="campus-grid">
              ${school.campuses.map(c => cardHtml(school, c)).join("")}
            </div>
          </section>
        `).join("");

        // Reveal each photo once it has loaded (stops the shimmer)
        groupsEl.querySelectorAll(".campus-photo").forEach(box => {
          const img = box.querySelector("img");
          const done = () => box.classList.add("loaded");
          if (img.complete && img.naturalWidth) done();
          else {
            img.addEventListener("load", done);
            img.addEventListener("error", done);   // stop shimmering even if the file is missing
          }
        });
      }

      // ------------------------------------------------------------
      // SEARCH
      // ------------------------------------------------------------
      function applySearch() {
        const q = searchEl.value.trim().toLowerCase();
        clearEl.classList.toggle("visible", q.length > 0);

        let totalVisible = 0;
        groupsEl.querySelectorAll(".school-group").forEach(group => {
          let visibleInGroup = 0;
          group.querySelectorAll(".campus-card").forEach(card => {
            const match = !q || card.dataset.search.includes(q);
            card.style.display = match ? "" : "none";
            if (match) visibleInGroup++;
          });
          group.style.display = visibleInGroup ? "" : "none";
          totalVisible += visibleInGroup;
        });

        noResultsEl.classList.toggle("visible", totalVisible === 0);
      }

      searchEl.addEventListener("input", applySearch);

      clearEl.addEventListener("click", () => {
        searchEl.value = "";
        applySearch();
        searchEl.focus();
      });

      // Enter opens the first visible campus
      searchEl.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const first = Array.from(groupsEl.querySelectorAll(".campus-card"))
          .find(card => card.style.display !== "none");
        if (first) first.click();
      });

      render();
    </script>
    <script src="functions.js"></script>
  </body>
</html>
