<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNI-COL News</title>
    <link rel="stylesheet" href="style.css">
    <script src="database.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #f5f5f5;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      body.loaded { opacity: 1; }

      /* ========================================
         HEADER - Modern purple gradient (from U3)
         ======================================== */
      .news-header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 32px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-bottom: 1px solid rgba(255,255,255,0.2);
      }

      .news-header .banner-logo {
        height: 48px;
        width: auto;
        cursor: pointer;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        transition: transform 0.2s ease;
      }

      .news-header .banner-logo:hover {
        transform: scale(1.05);
      }

      .news-header h1 {
        font-size: 28px;
        font-weight: 700;
        color: #fff;
        margin: 0;
        text-shadow: 0 2px 4px rgba(0,0,0,0.2);
      }

      .news-header .admin-actions {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }

      .news-header .createpost-btn {
        padding: 8px 16px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.4);
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(10px);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .news-header .createpost-btn:hover {
        background: rgba(255,255,255,0.25);
        transform: translateY(-2px);
      }

      .news-header .logout-btn {
        background: rgba(255, 100, 100, 0.2) !important;
        border-color: rgba(255, 150, 150, 0.4) !important;
      }

      .news-header .logout-btn:hover {
        background: rgba(255, 100, 100, 0.35) !important;
      }

      /* ========================================
         MAIN LAYOUT - U2 structure kept
         ======================================== */
      .news-layout {
        display: grid;
        grid-template-columns: 160px 1fr 300px;
        gap: 0;
        height: calc(100vh - 81px);
      }

      /* ========================================
         LEFT - Filters (modernized from U3)
         ======================================== */
      .filters-sidebar {
        padding: 20px 16px;
        border-right: 1px solid #ddd;
        background: #fff;
      }

      .filters-sidebar h3 {
        font-size: 14px;
        font-weight: 700;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 16px;
      }

      .filter-group {
        margin-bottom: 16px;
      }

      .filter-label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #777;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .filter-select {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
        background: #fff;
        font-size: 13px;
        color: #333;
        cursor: pointer;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .filter-select:hover,
      .filter-select:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        outline: none;
      }

      /* ========================================
         CENTER - Search + Cards (modernized from U3)
         ======================================== */
      .news-main {
        padding: 20px 24px;
        overflow-y: auto;
        background: #f8f8f8;
      }

      .search-bar {
        margin-bottom: 20px;
      }

      .search-input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .search-icon {
        position: absolute;
        left: 14px;
        color: #999;
        font-size: 16px;
      }

      #searchInput {
        width: 100%;
        padding: 10px 14px 10px 42px;
        border-radius: 10px;
        border: 1px solid #ddd;
        background: #fff;
        font-size: 14px;
        color: #333;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      #searchInput:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        outline: none;
      }

      /* News Cards Grid */
      #news-container {
        display: grid;
        grid-template-columns: repeat(3, 400px);
        gap: 20px;
        justify-content: center;
      }

      .news-card {
        background: #fff;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        cursor: pointer;
        position: relative;
        width: 400px;
        height: 550px;
        opacity: 0;
        animation: fadeIn 0.3s ease forwards;
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                    box-shadow 0.3s ease;
      }

      .news-card:nth-child(1) { animation-delay: 0.05s; }
      .news-card:nth-child(2) { animation-delay: 0.1s; }
      .news-card:nth-child(3) { animation-delay: 0.15s; }
      .news-card:nth-child(4) { animation-delay: 0.2s; }
      .news-card:nth-child(5) { animation-delay: 0.25s; }
      .news-card:nth-child(6) { animation-delay: 0.3s; }

      @keyframes fadeIn {
        to { opacity: 1; }
      }

      .news-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      }

      .news-card-image {
        width: 100%;
        height: 65%;
        background-size: cover;
        background-position: center;
        position: relative;
      }

      .news-card-image::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 40%;
        background: linear-gradient(to top, rgba(0,0,0,0.3), transparent);
      }

      .news-card-body {
        padding: 24px 20px;
        height: 35%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .news-card-title {
        font-size: 18px;
        font-weight: 800;
        color: #1a1a1a;
        text-align: center;
        line-height: 1.35;
        letter-spacing: -0.01em;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Empty state */
      .news-empty {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 20px;
        color: #888;
      }

      /* Pagination */
      .pagination {
        display: flex;
        justify-content: center;
        gap: 4px;
        margin-top: 24px;
        padding: 16px 0;
      }

      .pagination button {
        min-width: 36px;
        height: 36px;
        padding: 0 10px;
        border: 1px solid #ddd;
        background: #fff;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        color: #555;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .pagination button:hover:not(:disabled) {
        background: #f5f5f5;
        border-color: #667eea;
        color: #667eea;
      }

      .pagination button.active {
        background: #667eea;
        color: #fff;
        border-color: #667eea;
      }

      .pagination button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }


      /* Modal admin buttons — same style as close button */
      .modal-action-btn {
        padding: 10px 20px;
        border-radius: 10px;
        border: 1px solid #ddd;
        background: #f5f5f5;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-top: 20px;
        margin-right: 10px;
        color: #333;
      }

      .modal-action-btn:hover {
        background: #eee;
        transform: translateY(-2px);
      }

      .modal-action-btn.delete-btn {
        background: rgba(255, 100, 100, 0.12);
        border-color: rgba(255, 150, 150, 0.4);
        color: #c0392b;
      }

      .modal-action-btn.delete-btn:hover {
        background: rgba(255, 100, 100, 0.22);
      }

      /* ========================================
         RIGHT - Calendar (modernized from U3, U2 layout)
         ======================================== */
      .calendar-sidebar {
        border-left: 1px solid #ddd;
        background: #fff;
        padding: 20px;
        height: 100%;
        overflow-y: auto;
      }

      .calendar-header {
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 2px solid #f0f0f0;
      }

      .calendar-header h2 {
        font-size: 20px;
        font-weight: 700;
        color: #333;
        margin: 0;
      }

      .calendar-rows {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .calendar-row {
        display: flex;
        gap: 14px;
        padding: 12px;
        background: #f8f8f8;
        border-radius: 12px;
        border: 1px solid #eee;
        transition: all 0.2s ease;
      }

      .calendar-row:hover {
        background: #f0f0f0;
        transform: translateX(4px);
      }

      .calendar-date {
        font-weight: 700;
        font-size: 13px;
        color: #667eea;
        white-space: nowrap;
        min-width: 80px;
      }

      .calendar-event {
        font-size: 13px;
        color: #555;
        line-height: 1.4;
      }

      .calendar-add {
        width: 100%;
        margin-top: 16px;
        padding: 12px;
        border-radius: 12px;
        border: 2px dashed #ddd;
        background: transparent;
        color: #888;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .calendar-add:hover {
        border-color: #667eea;
        color: #667eea;
        background: rgba(102, 126, 234, 0.05);
      }

      /* ========================================
         MODALS (modernized from U3)
         ======================================== */
      .image-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100001;
        cursor: zoom-out;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease, background 0.3s ease;
      }

      .image-overlay.visible {
        opacity: 1;
        pointer-events: auto;
        background: rgba(0, 0, 0, 0.92);
      }

      .image-overlay img {
        max-width: 95vw;
        max-height: 95vh;
        object-fit: contain;
        border-radius: 8px;
        cursor: default;
        transform: scale(0.1);
        opacity: 0;
        transition: none;
      }

      .image-overlay.visible img {
        transform: scale(1);
        opacity: 1;
        transition: transform 0.5s cubic-bezier(0.34, 1.30, 0.20, 1), opacity 0.4s ease;
      }

      .image-overlay.closing {
        opacity: 0;
        pointer-events: none;
      }

      .image-overlay.closing img {
        transform: scale(0.1);
        opacity: 0;
        transition: transform 0.3s ease-in, opacity 0.2s ease;
      }

      .image-overlay-close {
        position: absolute;
        top: 24px;
        right: 24px;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255,255,255,0.2);
        color: #fff;
        font-size: 20px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform: scale(0.5);
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
      }

      .image-overlay.visible .image-overlay-close {
        opacity: 1;
        transform: scale(1);
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s;
      }

      .image-overlay-close:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: scale(1.1);
      }

      .post-modal {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: none;
        overflow: hidden;
      }

      .post-modal.show { display: block; }
      .post-modal.hidden { display: none; }

      .post-modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
      }

      .post-modal-panel {
        position: absolute;
        top: 40px;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%) scale(0.92);
        width: min(800px, calc(100vw - 40px));
        background: #fff;
        border-radius: 16px;
        padding: 60px 24px 24px 24px;
        overflow-y: auto;
        z-index: 1;
        opacity: 0;
        animation: modalIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .post-modal.closing .post-modal-panel {
        animation: modalOut 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @keyframes modalIn {
        to { opacity: 1; transform: translateX(-50%) scale(1); }
      }

      @keyframes modalOut {
        to { opacity: 0; transform: translateX(-50%) scale(0.92); }
      }

      .post-modal-close {
        position: absolute;
        top: 16px;
        left: 16px;
        border: 1px solid #ddd;
        background: #f5f5f5;
        border-radius: 10px;
        padding: 8px 16px;
        cursor: pointer;
        font-size: 14px;
        z-index: 2;
        transition: all 0.2s ease;
      }

      .post-modal-close:hover {
        background: #eee;
        transform: translateY(-2px);
      }

      .confirm-modal {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.35);
      }

      .confirm-panel {
        width: min(400px, 90%);
        background: #fff;
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        animation: confirmPop 0.28s ease-out;
      }

      @keyframes confirmPop {
        0% { opacity: 0; transform: scale(0.92); }
        100% { opacity: 1; transform: scale(1); }
      }

      .confirm-text {
        color: #333;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 24px;
      }

      .confirm-buttons {
        display: flex;
        justify-content: center;
        gap: 14px;
      }

      .confirm-buttons button {
        border: 0;
        cursor: pointer;
        padding: 12px 34px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 650;
        transition: all 0.2s ease;
      }

      #confirmYes {
        background: #667eea;
        color: #fff;
      }

      #confirmYes:hover {
        background: #5a6fd6;
        transform: translateY(-2px);
      }

      #confirmNo {
        background: #eee;
        color: #555;
      }

      #confirmNo:hover {
        background: #e0e0e0;
      }

      .hidden { display: none !important; }

      /* ========================================
         RESPONSIVE
         ======================================== */
      @media (max-width: 1000px) {
        .news-layout {
          grid-template-columns: 140px 1fr 240px;
        }
      }

      @media (max-width: 768px) {
        .news-layout {
          grid-template-columns: 1fr;
          height: auto;
        }

        .filters-sidebar {
          border-right: none;
          border-bottom: 1px solid #ddd;
          display: flex;
          flex-wrap: wrap;
          gap: 16px;
          padding: 16px;
        }

        .filters-sidebar h3 {
          width: 100%;
          margin-bottom: 8px;
        }

        .filter-group {
          flex: 1;
          min-width: 150px;
          margin-bottom: 0;
        }

        #news-container {
          grid-template-columns: repeat(2, 1fr);
        }

        .calendar-sidebar {
          border-left: none;
          border-top: 1px solid #ddd;
          height: auto;
          min-height: 300px;
        }
      }

      @media (max-width: 480px) {
        .news-header {
          padding: 12px 16px;
        }

        .news-header h1 {
          font-size: 20px;
        }

        .news-header .banner-logo {
          height: 36px;
        }

        #news-container {
          grid-template-columns: 1fr;
        }

        .news-card {
          aspect-ratio: 16 / 9;
        }
      }

      /* Toast (modernized from U3) */
      .toast-container {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(-100px);
        z-index: 100003;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        pointer-events: none;
      }

      .toast-container.visible {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }

      .toast {
        background: #333;
        color: #fff;
        padding: 16px 28px;
        border-radius: 50px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 15px;
        font-weight: 600;
        min-width: 220px;
        justify-content: center;
      }

      .toast.success { background: #51cf66; }
      .toast.error { background: #ff6b6b; }
    </style>

<base target="_blank">
</head>
  <body>
    <!-- Toast -->
    <div id="toastContainer" class="toast-container">
      <div id="toast" class="toast">
        <span id="toastText">Loading...</span>
      </div>
    </div>

    <!-- Header -->
    <header class="news-header">
      <img src="unicols.png" class="banner-logo" alt="UNI-COL News" onclick="window.location.href='index.html'">
      <h1 id="collegeName"></h1>
      <div class="admin-actions">
        <button class="createpost-btn admin-only" id="createPostBtn" onclick="goCreate()">Create Post</button>
        <button class="createpost-btn admin-only" id="registerLoginBtn" onclick="goToLogin()">Register</button>
        <button class="createpost-btn logout-btn admin-only" id="logoutBtn" onclick="handleLogout()">Logout</button>
        <button class="createpost-btn" id="adminLoginBtn" onclick="goToLogin()">Admin Login</button>
      </div>
    </header>

    <!-- Main Layout -->
    <div class="news-layout">

      <!-- Left: Filters -->
      <aside class="filters-sidebar">
        <h3>Filters</h3>

        <div class="filter-group">
          <label class="filter-label">Year</label>
          <select id="yearFilter" class="filter-select">
            <option value="all">All</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label">Department</label>
          <select id="courseFilter" class="filter-select">
            <option value="all">All</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label">Month</label>
          <select id="monthFilter" class="filter-select">
            <option value="all">All</option>
            <option value="01">January</option>
            <option value="02">February</option>
            <option value="03">March</option>
            <option value="04">April</option>
            <option value="05">May</option>
            <option value="06">June</option>
            <option value="07">July</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>
      </aside>

      <!-- Center: Search + Cards -->
      <main class="news-main">
        <div class="search-bar">
          <div class="search-input-wrapper">
            <span class="search-icon">&#128269;</span>
            <input type="text" id="searchInput" placeholder="Search..." />
          </div>
        </div>

        <div id="news-container"></div>

        <div id="pagination" class="pagination"></div>
      </main>

      <!-- Right: Calendar (full height) -->
      <aside class="calendar-sidebar">
        <div class="calendar-header">
          <h2>Academic Calendar</h2>
        </div>

        <div id="calendarRows" class="calendar-rows"></div>

        <button id="addCalendarRowBtn" class="calendar-add admin-only">+ Add Event</button>
      </aside>

    </div>

    <!-- Post Modal -->
    <div id="postModal" class="post-modal hidden">
      <div class="post-modal-backdrop" onclick="closePostModal()"></div>
      <div class="post-modal-panel">
        <button class="post-modal-close" onclick="closePostModal()">&#10005; Close</button>
        <div id="postModalContent"></div>
      </div>
    </div>

    <!-- Image Overlay -->
    <div id="imageOverlay" class="image-overlay">
      <button class="image-overlay-close" onclick="closeImageOverlay()">&#10005;</button>
      <img id="fullImage" src="" alt="" onclick="event.stopPropagation()">
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="confirm-modal hidden">
      <div class="confirm-panel">
        <p id="confirmText" class="confirm-text"></p>
        <div class="confirm-buttons">
          <button id="confirmYes">Yes</button>
          <button id="confirmNo">No</button>
        </div>
      </div>
    </div>

    <script src="news.js"></script>
    <script src="functions.js"></script>
  </body>
</html>
